name: VlogNudge
options:
  bundleIdPrefix: com.taylordrew
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:

  VlogNudge:
    type: application
    platform: iOS
    sources:
      - path: VlogNudge
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylordrew.vlognudge
        INFOPLIST_FILE: VlogNudge/Info.plist
        CODE_SIGN_ENTITLEMENTS: VlogNudge/VlogNudge.entitlements
    dependencies:
      - target: VlogNudgeWidgets
      - target: VlogNudgeNotificationService
      - target: VlogNudgeDeviceActivity

  VlogNudgeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VlogNudgeWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: VlogNudge/Shared/AppConstants.swift
      - path: VlogNudge/Services/LiveActivityAttributes.swift
      - path: VlogNudge/Intents/AppIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylordrew.vlognudge.Widgets
        INFOPLIST_FILE: VlogNudgeWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: VlogNudgeWidgets/VlogNudgeWidgets.entitlements
        SKIP_INSTALL: YES

  VlogNudgeNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: VlogNudgeNotificationService
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: VlogNudge/Shared/AppConstants.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylordrew.vlognudge.NotificationService
        INFOPLIST_FILE: VlogNudgeNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: VlogNudgeNotificationService/VlogNudgeNotificationService.entitlements
        SKIP_INSTALL: YES

  VlogNudgeDeviceActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: VlogNudgeDeviceActivity
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: VlogNudge/Shared/AppConstants.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylordrew.vlognudge.DeviceActivity
        INFOPLIST_FILE: VlogNudgeDeviceActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: VlogNudgeDeviceActivity/VlogNudgeDeviceActivity.entitlements
        SKIP_INSTALL: YES

schemes:
  VlogNudge:
    build:
      targets:
        VlogNudge: all
        VlogNudgeWidgets: all
        VlogNudgeNotificationService: all
        VlogNudgeDeviceActivity: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
