name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [screenshots]

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture README screenshots
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        run: scripts/capture_screenshots.sh
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
